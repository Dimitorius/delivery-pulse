# Delivery Pulse — full metric catalog (content layer)
# Written in Cowork by Claude, reviewed by Dmitry. Code merges this with registry/metrics/*.yaml by `id`.
#
# status:
#   live       — computed from simulator events (core 50); registry/metrics/<id>.yaml holds formula/target
#   featured   — SYNTHETIC but a showcase tile on its tab (DXI, eNPS, EBM Current Value, CPI)
#   synthetic  — SYNTHETIC series, off by default, enable in Library
#   view       — a chart/view rather than a single number (CFD, burn-up …)
#   anti       — anti-metric: catalog + Learn only, never a dashboard
# tier: 1 Start here · 2 Core · 3 Situational · 4 Specialist
# levels: lagging | current | leading
# source: tracker | vcs | ci | monitoring | incident | survey | finance | manual | product-analytics
# aliases: framework vocabulary for the "also known as" chips and the Framework lens.
#   rel "≡" = same definition, "≈" = related but defined differently (note says how).

# ───────────────────────────── FLOW ─────────────────────────────
- id: throughput
  name: Throughput
  domain: Flow
  levels: [lagging]
  source: tracker
  tier: 1
  status: live
  q: How many work items do we finish per week?
  aliases:
    - { fw: SAFe, name: Flow Velocity, rel: "≡" }
    - { fw: Flow Framework, name: Flow Velocity, rel: "≡" }
    - { fw: Scrum, name: Velocity, rel: "≈", note: "Velocity counts story points per sprint, not items per unit of time." }

- id: cycle-time
  name: Cycle Time
  domain: Flow
  levels: [lagging]
  source: tracker
  tier: 1
  status: live
  q: Once we start an item, how long until it is finished?
  aliases:
    - { fw: Flow Framework, name: Flow Time, rel: "≈", note: "Flow Time starts at the first active state (same) but stops when the item is available to the customer, not at Done." }

- id: lead-time
  name: Lead Time
  domain: Flow
  levels: [lagging]
  source: tracker
  tier: 1
  status: live
  q: From the moment someone asks, how long until they get it?
  aliases:
    - { fw: SAFe, name: Flow Time, rel: "≈", note: "SAFe Flow Time runs from entering the value stream to 'in the hands of the customer'; our Lead Time stops at Done." }

- id: wip
  name: Work in Progress (WIP)
  domain: Flow
  levels: [current]
  source: tracker
  tier: 1
  status: live
  q: How many items have we started but not finished?
  aliases:
    - { fw: SAFe, name: Flow Load, rel: "≡" }
    - { fw: Flow Framework, name: Flow Load, rel: "≡" }

- id: aging-wip
  name: Work Item Age & Aging WIP
  domain: Flow
  levels: [current, leading]
  source: tracker
  tier: 1
  status: live
  q: Which items in flight are already older than we usually take?

- id: flow-efficiency
  name: Flow Efficiency
  domain: Flow
  levels: [current]
  source: tracker
  tier: 2
  status: live
  q: Of an item's elapsed time, how much is actually spent working on it?
  aliases:
    - { fw: SAFe, name: Flow Efficiency, rel: "≡" }
    - { fw: Flow Framework, name: Flow Efficiency, rel: "≡" }

- id: net-flow
  name: Net Flow
  domain: Flow
  levels: [leading]
  source: tracker
  tier: 2
  status: live
  q: Is work arriving faster than we finish it (arrived − finished)?

- id: blocked-items
  name: Blocked Items & Blocked Time
  domain: Flow
  levels: [current, leading]
  source: tracker
  tier: 2
  status: live
  q: How much of our work is stuck waiting on something, and for how long?

- id: queue-size-by-stage
  name: Queue Size by Stage
  domain: Flow
  levels: [current, leading]
  source: tracker
  tier: 2
  status: live
  q: Where is work piling up — review, QA, waiting for deploy?

- id: sle-attainment
  name: SLE Attainment
  domain: Flow
  levels: [lagging]
  source: tracker
  tier: 2
  status: live
  q: What share of finished items met our service level expectation?

- id: flow-distribution
  name: Flow Distribution
  domain: Flow
  levels: [lagging]
  source: tracker
  tier: 2
  status: live
  q: What mix of work did we deliver — features, defects, debt, risk?
  aliases:
    - { fw: SAFe, name: Flow Distribution, rel: "≡" }
    - { fw: Flow Framework, name: Flow Distribution, rel: "≡" }

- { id: cumulative-flow, name: Cumulative Flow Diagram, domain: Flow, levels: [lagging, current], source: tracker, tier: 2, status: view, q: "How do arrivals, WIP and departures evolve by stage over time?" }
- { id: cycle-time-scatterplot, name: Cycle Time Scatterplot, domain: Flow, levels: [lagging], source: tracker, tier: 2, status: view, q: "What does every finished item's cycle time look like, with percentile lines?" }
- { id: arrival-rate, name: Arrival Rate, domain: Flow, levels: [leading], source: tracker, tier: 3, status: synthetic, q: "How many new items enter the system per week?" }
- { id: time-in-status, name: Time in Status (per stage), domain: Flow, levels: [lagging], source: tracker, tier: 3, status: synthetic, q: "Which stage of the workflow eats the most time?" }
- { id: handoffs-per-item, name: Handoffs per Item, domain: Flow, levels: [lagging], source: tracker, tier: 3, status: synthetic, q: "How many times does an item change hands before Done?" }
- { id: batch-size, name: Batch Size, domain: Flow, levels: [lagging], source: tracker, tier: 3, status: synthetic, q: "How many items ship together in one release?" }
- { id: wip-per-person, name: WIP per Person, domain: Flow, levels: [current], source: tracker, tier: 3, status: synthetic, q: "How many items is each person juggling on average (team-level, never per name)?" }
- { id: wip-limit-breaches, name: WIP Limit Breaches, domain: Flow, levels: [current, leading], source: tracker, tier: 3, status: synthetic, q: "How often do we exceed our own WIP limits?" }
- { id: throughput-variability, name: Throughput Variability, domain: Flow, levels: [lagging], source: tracker, tier: 3, status: synthetic, q: "How stable is our weekly throughput (coefficient of variation)?" }
- { id: cycle-time-tail-ratio, name: Cycle Time Tail Ratio (P85/P50), domain: Flow, levels: [lagging, leading], source: tracker, tier: 3, status: synthetic, q: "How fat is the tail — how much worse is a slow item than a typical one?" }

