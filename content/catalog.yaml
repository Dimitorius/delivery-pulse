# ─────────────────────── SCALE (SAFe) ───────────────────────
# Dmitry 30.09: every SAFe metric is live/visible, not only PI Predictability.
# The Scale tab shows the six SAFe flow metrics under their SAFe names. They are the same live
# computations as the Flow entries (no duplicate code), listed here via `scale_tab`.
