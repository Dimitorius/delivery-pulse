id: say-do-ratio
tab: flow
pulse: true
order: 70
name: Say/Do Ratio
short: Say/Do
domain: Scrum
column: lagging
levels: [lagging]
source: tracker
unit: "%"
format: number
decimals: 0
direction: higher-better
window: last 3 closed sprints per team
question: Do we deliver what we commit to at sprint planning?
definition: >-
  Story points of items committed at sprint planning that were Done by the sprint's
  end, divided by committed points. Items added mid-sprint are not in the
  commitment. Kanban teams have no sprints and are skipped.
formula: |-
  sprints   = last 3 closed sprints of each Scrum team in scope
  committed = Σ points of items committed at planning
  delivered = Σ points of those items with doneAt ≤ sprint end
  value     = 100 · delivered / committed
events: [iteration.committed, iteration.closed, item.status]
target:
  op: range
  min: 80
  max: 90
  warnMin: 70
  note: >-
    Team goal: a corridor of 80–90 %. Below 70 % is off target; outside the corridor otherwise is "near limit".
    When every one of a team's last 3 sprints is above 95 % the tile shows "possible sandbagging".
benchmark:
  kind: team-goal
  label: Team goal, not a benchmark
  summary: >-
    No research-based benchmark; the 80–90 % corridor is our team goal. The Scrum Guide defines commitment to the Sprint Goal, not to a ratio.
  sources: []
minSample: 10
xmr: false
related: [sprint-goal-success, carry-over, velocity]
aka:
  safe:
    name: Iteration Say/Do
    eq: "≡"
    note: "Vocabulary only: SAFe calls sprints iterations."
    sources: [safe-pi-objectives]
changelog:
  - date: "2026-09-25"
    change: "Target changed from \"≥ 80 %\" to the 80–90 % corridor; \"possible sandbagging\" flag when every one of a team's last 3 sprints is above 95 % (Dmitry's review)."
  - date: "2026-09-25"
    change: "Sample size n is now the number of committed items with points (low confidence below 10)."
