id: reopen-rate
order: 312
tab: quality
name: Reopen Rate
short: Reopen rate
domain: Quality & Reliability
column: lagging
levels:
- lagging
source: tracker
unit: '%'
decimals: 1
direction: lower-better
window: rolling 28 days
question: How often do we call something done and then reopen it?
definition: Items moved out of Done in the window, relative to items that reached Done in the window.
formula: |-
  reopened = flow items with a Done → not-Done transition in the window
  value    = 100 · count(reopened) / count(items reaching Done in the window)
events:
- item.status
target:
  op: <=
  value: 5
  warn: 10
  note: Team goal — under 5 %.
benchmark:
  kind: team-goal
  label: Team goal, not a benchmark
  summary: No research-based benchmark; the threshold is ours.
  sources: []
minSample: 10
xmr: false
related:
- escaped-defects
- flow-efficiency
format: number
