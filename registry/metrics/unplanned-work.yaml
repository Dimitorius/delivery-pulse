id: unplanned-work
tab: program
pulse: true
order: 240
name: Unplanned Work
short: Unplanned work
domain: Program
column: leading
levels: [leading, lagging]
source: tracker
unit: "%"
format: number
decimals: 0
direction: lower-better
window: rolling 28 days
question: How much of what we finish was never planned?
definition: >-
  Share of finished items that were unplanned — production bugs, urgent requests and
  expedited Kanban items. A rising share predicts missed sprint and PI commitments.
formula: |-
  done  = flow items with Done in the window
  value = 100 · count(done where planned = false) / count(done)
events: [item.created, item.status]
target:
  op: "<="
  value: 20
  warn: 30
  note: Team goal from the elite profile (15–20 %).
benchmark:
  kind: team-goal
  label: Team goal, not a benchmark
  summary: >-
    No research-based benchmark for this exact ratio; 15–20 % is our team goal.
  sources: []
minSample: 10
xmr: true
related: [sprint-scope-change, investment-allocation]
