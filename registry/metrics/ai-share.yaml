id: ai-share
order: 610
tab: ai
name: AI-assisted Change Share
short: AI-assisted changes
domain: AI Impact
column: current
levels:
- current
source: vcs (commit metadata)
unit: '%'
decimals: 0
direction: neutral
window: rolling 28 days
question: How much of our code change is AI-assisted?
