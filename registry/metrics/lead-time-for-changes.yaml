id: lead-time-for-changes
order: 30
name: Lead Time for Changes
short: Change lead time P50
domain: Delivery · DORA
column: lagging
levels: [lagging]
source: vcs + ci
unit: h
format: number
decimals: 1
direction: lower-better
window: rolling 28 days
question: How fast does a committed change reach production?
definition: >-
  Time from the first commit of a merge request until the deployment that put it in
  production. Median over changes deployed in the window.
formula: |-
  changes = merge requests with deployedAt in the window
  lead    = deployedAt − firstCommitAt   (calendar hours)
  value   = P50(lead); also P85
events: [mr.opened, deployment]
target:
  op: "<="
  value: 24
  warn: 48
  note: Team goal from the elite profile (P50 under one day).
benchmark:
  kind: research
  label: DORA 2024 performance clusters
  summary: "DORA 2024 performance clusters — elite: change lead time under one day."
  note: >-
    In DORA 2025 the elite/high/medium/low clusters were replaced by seven team archetypes; the 2024 clusters are shown as the last published tiers. One primary research program (DORA survey) — accepted by Dmitry (review 25.09.2026).
  sources: [dora-2024, dora-metrics-guide, redmonk-dora-2024, dora-2025, redmonk-dora-2025, agility-at-scale-dora-2025]
minSample: 10
xmr: true
