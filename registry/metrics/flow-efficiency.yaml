id: flow-efficiency
tab: flow
pulse: true
order: 120
name: Flow Efficiency
short: Flow efficiency
domain: Flow
column: current
levels: [current]
source: tracker
unit: "%"
format: number
decimals: 0
direction: higher-better
window: rolling 28 days
question: Of the time an item is in flight, how much is someone actually working on it?
definition: >-
  Time in active statuses (In Progress, In Review, In QA) divided by total cycle time,
  summed over items finished in the window. Time flagged as blocked counts as waiting
  even in an active status. Status-based: it cannot see context switching inside
  "In Progress".
formula: |-
  done   = flow items with Done in the window
  active = Σ time in active statuses − blocked time
  total  = Σ (doneAt − first In Progress)
  value  = 100 · active / total
events: [item.status, item.blocked, item.unblocked]
target:
  op: ">="
  value: 35
  warn: 25
  note: Team goal from the elite profile (35–45 %).
benchmark:
  kind: disputed
  label: Disputed — two positions, no single "right" number
  summary: Two positions are shown side by side; neither is treated as the benchmark.
  positions:
    - label: Kanban University
      summary: Teams that do not actively manage flow typically sit at about 5–15 % flow efficiency.
      sources: [kanban-university-fe]
    - label: ASOS data (N. Brown)
      summary: >-
        Real data from 60+ ASOS teams was collected because the quoted ranges had no published data behind
        them; Brown also argues the metric itself is unreliable (what counts as "active" is hard to define).
        See the source for the observed values.
      sources: [asos-fe-survey, asos-fe-flaws]
  sources: []
minSample: 10
xmr: true
related: [cycle-time, queue-size, blocked-items]
aka:
  safe:
    name: Flow Efficiency
    eq: "≡"
    note: "Active time as a share of total elapsed time."
    sources: [safe-measure-and-grow, agility-at-scale-flow]
  flow:
    name: Flow Efficiency
    eq: "≡"
    note: "Active time as a share of flow time."
    sources: [flow-framework, kersten-p2p]
changelog:
  - date: "2026-09-25"
    change: "Benchmark shown as disputed: Kanban University and ASOS positions side by side (Dmitry's review)."
