id: aging-wip
tab: flow
pulse: true
order: 220
name: Aging WIP over SLE
short: Aging over SLE
domain: Flow
column: leading
levels: [leading]
source: tracker
unit: items
format: number
decimals: 0
direction: lower-better
window: at this moment (SLE from last 12 weeks)
question: Which items in flight are already older than we usually take?
definition: >-
  Work-in-progress items whose age exceeds their team's service level expectation (SLE):
  the 85th percentile cycle time of items the team finished in the last 12 weeks. An
  item over the SLE is a leading signal: act before it becomes a late delivery.
formula: |-
  SLE(team) = P85(cycle time of team items done in the last 84 days)
  age       = asOf − first In Progress
  value     = count(WIP items with age > SLE(item.team))
events: [item.status]
target:
  op: "<="
  value: 1
  warn: 2
  per: team
  note: Team goal — at most one item per team beyond its SLE.
benchmark:
  kind: by-design
  label: No benchmark by design
  summary: No industry benchmark by design; Work Item Age against an SLE is a core Kanban practice.
  sources: [kanban-guide-2025, vacanti-wwibd]
xmr: false
related: [cycle-time, sle-attainment, wip]
