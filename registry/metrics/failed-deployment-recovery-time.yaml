id: failed-deployment-recovery-time
tab: delivery
pulse: true
order: 60
name: Failed Deployment Recovery Time
short: Recovery time P50
domain: Delivery · DORA
column: lagging
levels: [lagging]
source: deploy tool + incidents
unit: min
format: number
decimals: 0
direction: lower-better
window: rolling 28 days
question: When a deployment breaks production, how fast do we restore service?
definition: >-
  Time from a failed deployment to the resolution (service restored) of the incident it
  caused. Median over incidents resolved in the window. Incidents not caused by a
  deployment are excluded (they belong to incident MTTR).
formula: |-
  incidents = incidents with a deploymentId, resolved in the window
  recovery  = resolvedAt − deployment.at   (minutes)
  value     = P50(recovery); also P85
events: [deployment, incident.opened, incident.resolved]
target:
  op: "<="
  value: 60
  warn: 120
  note: Team goal from the elite profile (under one hour).
benchmark:
  kind: research
  label: DORA 2024 performance clusters
  summary: "DORA 2024 performance clusters — elite: under one hour."
  note: >-
    In DORA 2025 the elite/high/medium/low clusters were replaced by seven team archetypes; the 2024 clusters are shown as the last published tiers. One primary research program (DORA survey) — accepted by Dmitry (review 25.09.2026).
  sources: [dora-2024, dora-metrics-guide, redmonk-dora-2024, dora-2025, redmonk-dora-2025, agility-at-scale-dora-2025]
minSample: 10
xmr: false
related: [change-failure-rate, incident-mttr]
