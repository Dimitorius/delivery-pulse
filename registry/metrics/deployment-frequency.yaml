id: deployment-frequency
tab: delivery
pulse: true
order: 40
name: Deployment Frequency
short: Deploys / service / day
domain: Delivery · DORA
column: lagging
levels: [lagging]
source: ci / deploy tool
unit: /day
format: number
decimals: 2
direction: higher-better
window: rolling 28 days
question: How often do we ship to production?
definition: >-
  Regular production deployments per service per working day. Rollbacks are
  remediation, not delivery, so they are excluded.
formula: |-
  deploys = deployments of kind "regular" in the window
  value   = count(deploys) / working days in window / services in scope
events: [deployment]
target:
  op: ">="
  value: 1
  warn: 0.5
  note: Team goal — every service deploys at least daily; elite teams deploy on demand.
benchmark:
  kind: research
  label: DORA 2024 performance clusters
  summary: "DORA 2024 performance clusters — elite: on demand, multiple deploys per day."
  note: >-
    In DORA 2025 the elite/high/medium/low clusters were replaced by seven team archetypes; the 2024 clusters are shown as the last published tiers. One primary research program (DORA survey) — accepted by Dmitry (review 25.09.2026).
  sources: [dora-2024, dora-metrics-guide, redmonk-dora-2024, dora-2025, redmonk-dora-2025, agility-at-scale-dora-2025]
xmr: true
related: [lead-time-for-changes, change-failure-rate]
changelog:
  - date: "2026-09-25"
    change: "Benchmark labelled \"DORA 2024 performance clusters\", with a note on the DORA 2025 archetypes."
