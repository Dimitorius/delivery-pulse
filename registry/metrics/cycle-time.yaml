id: cycle-time
tab: flow
pulse: true
order: 20
name: Cycle Time
short: Cycle time P85
domain: Flow
column: lagging
levels: [lagging]
source: tracker
unit: d
format: number
decimals: 1
direction: lower-better
window: rolling 28 days
question: How long does an item take once we start it?
definition: >-
  Elapsed calendar time from the first move into an active or queue status
  (commitment point: In Progress) until Done. Shown as the 85th percentile —
  "85 % of items finished within X days" — with the median alongside.
formula: |-
  done  = flow items with Done in the window
  cycle = doneAt − first In Progress   (calendar days, weekends included)
  value = P85(cycle); also P50
  Pxx   = nearest rank: sort ascending, take element ⌈xx/100 · n⌉
events: [item.status]
target:
  op: "<="
  value: 7
  warn: 9
  note: Team goal from the elite profile (P85 of stories 5–7 days).
benchmark:
  kind: by-design
  label: No benchmark by design
  summary: >-
    No universal benchmark: cycle time depends on item size and workflow. Use the
    team's own percentiles as a service level expectation (SLE).
  sources: [kanban-guide-2025, vacanti-aamp]
minSample: 10
xmr: true
related: [throughput, wip, aging-wip, sle-attainment]
