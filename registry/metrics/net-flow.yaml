id: net-flow
tab: flow
pulse: true
order: 210
name: Net Flow
short: Net flow · arrived − finished
domain: Flow
column: leading
levels: [leading]
source: tracker
unit: /wk
format: signed
decimals: 1
direction: lower-better
window: rolling 28 days
question: Are we starting more than we finish?
definition: >-
  Items that arrived (crossed the commitment point) minus items that finished (reached Done), per week.
  Positive means WIP is growing — cycle times will follow (Little's law). Sign
  conventions differ between tools; here positive = growing.
formula: |-
  arrived  = flow items whose first In Progress is in the window
  finished = flow items with Done in the window
  value    = (count(arrived) − count(finished)) / 4 weeks
events: [item.status]
target:
  op: "<="
  value: 1
  warn: 3
  per: team
  note: Team goal — WIP growth of at most one item per team per week.
benchmark:
  kind: by-design
  label: No benchmark by design
  summary: No industry benchmark; the link to cycle time is Little's law.
  note: Sign conventions differ between sources; here positive = WIP growing.
  sources: [littles-law, vacanti-aamp]
tileSecondary: 2
xmr: true
related: [wip, throughput]
changelog:
  - date: "2026-09-25"
    change: "Tile label made explicit: \"arrived − finished\"."
