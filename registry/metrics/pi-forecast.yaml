id: pi-forecast
order: 5
name: PI Forecast (Monte Carlo When)
short: On track for the PI?
domain: Forecast
column: forecast
levels: [leading]
source: tracker
unit: "%"
format: number
decimals: 0
direction: higher-better
window: last 20 working days of throughput
question: Will the remaining PI scope be done by the PI end date?
definition: >-
  Monte Carlo simulation (2,000 trials): in each trial every team draws its own daily
  story throughput at random from its last 20 working days until its remaining PI stories
  are done; the PI is done when the last team is done. The value is the share of trials
  that finish by the PI end; P50/P85 are completion dates. Teams are not pooled — pooled
  throughput would assume any team can finish any other team's stories.
formula: |-
  remaining(team) = team's PI-planned stories not Done at asOf
  samples(team)   = team's stories done in each of the last 20 completed working days
  trial           = per team: draw samples with replacement until Σ ≥ remaining → days
                    program days = max over teams
  value           = 100 · share(trials with days ≤ working days left in PI)
events: [iteration.planned, item.created, item.status]
target:
  op: ">="
  value: 85
  warn: 60
  note: Program goal — at least 85 % likely to finish the PI scope on time.
benchmark:
  summary: >-
    Method, not a benchmark: throughput-based Monte Carlo forecasting assumes the near
    future resembles the sampled past. It counts items, not their size.
  sources: [vacanti-wwibd, vacanti-aamp]
xmr: false
