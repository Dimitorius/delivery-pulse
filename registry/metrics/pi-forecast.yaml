id: pi-forecast
tab: forecast
pulse: true
order: 5
name: PI Forecast (Monte Carlo When)
short: On track for the PI?
domain: Forecast
column: forecast
levels: [leading]
source: tracker
unit: "%"
format: number
decimals: 0
direction: higher-better
window: last 30 development working days of throughput
question: Will the remaining PI scope be done by the PI end date?
definition: >-
  Monte Carlo simulation (2,000 trials): in each trial every team draws a week of
  story throughput at random from its last 30 development working days (IP iterations
  skipped) until its remaining committed PI stories are done; the PI is done when the
  last team is done. The value is the share of trials that finish by the PI end; P50/P85
  are completion dates. Teams are not pooled — pooled throughput would assume any team
  can finish any other team's stories. A story counts as finished at its first
  completion (a later reopen is rework, see Reopen Rate).
formula: |-
  remaining(team) = team's committed PI stories not Done at asOf (stretch excluded)
  daily(team)     = team's stories done in each of the last 30 development working days
  weeks(team)     = every run of 5 consecutive days in daily (26 overlapping weeks)
  trial           = per team: draw weeks with replacement until Σ ≥ remaining → days
                    (last week prorated); program days = max over teams
  value           = 100 · share(trials with days ≤ working days left in PI)
events: [iteration.planned, item.created, item.status]
target:
  op: ">="
  value: 85
  warn: 60
  note: Program goal — at least 85 % likely to finish the PI scope on time.
benchmark:
  kind: method
  label: Method, not a benchmark
  summary: >-
    Throughput-based Monte Carlo forecasting assumes the near
    future resembles the sampled past. It counts items, not their size.
  sources: [vacanti-wwibd, vacanti-aamp]
xmr: false
related: [mc-how-many, forecast-accuracy, pi-predictability]
changelog:
  - date: "2026-09-25"
    change: "Teams are simulated jointly (the PI is done when the last team is done) instead of pooling throughput."
  - date: "2026-09-25"
    change: "Throughput sampled in weekly blocks over the last 30 development days, IP iterations excluded; forecast covers committed scope only."
  - date: "2026-09-30"
    change: "Weeks are sampled as overlapping 5-day runs (moving-block bootstrap) instead of 6 fixed weeks: same week-level spread, no jumps when the fixed weeks are re-cut each day. A reopened story stays finished at its first completion."
