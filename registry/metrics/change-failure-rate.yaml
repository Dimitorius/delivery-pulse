id: change-failure-rate
tab: delivery
pulse: true
order: 50
name: Change Failure Rate
short: Change failure rate
domain: Delivery · DORA
column: lagging
levels: [lagging]
source: deploy tool + incidents
unit: "%"
format: number
decimals: 1
direction: lower-better
window: rolling 28 days
question: How often does a deployment break production?
definition: >-
  Share of regular deployments that caused a production incident (the incident
  record links the deployment).
formula: |-
  deploys = regular deployments in the window
  failed  = deploys referenced by an incident detected by asOf
  value   = 100 · count(failed) / count(deploys)
events: [deployment, incident.opened]
target:
  op: "<="
  value: 5
  warn: 10
  note: Team goal from the elite profile (3–5 %).
benchmark:
  kind: research
  label: DORA 2024 performance clusters
  summary: "DORA 2024 performance clusters — elite: about 5 %."
  note: >-
    In DORA 2025 the elite/high/medium/low clusters were replaced by seven team archetypes; the 2024 clusters are shown as the last published tiers. One primary research program (DORA survey) — accepted by Dmitry (review 25.09.2026).
  sources: [dora-2024, dora-metrics-guide, redmonk-dora-2024, dora-2025, redmonk-dora-2025, agility-at-scale-dora-2025]
minSample: 10
xmr: false
related: [rework-rate, failed-deployment-recovery-time, deployment-frequency]
changelog:
  - date: "2026-09-25"
    change: "Benchmark labelled \"DORA 2024 performance clusters\", with a note on the DORA 2025 archetypes."
